services:
  - type: web
    name: yolo-detect-project01
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_PATH
        value: /app/models/best.pt
      - key: FRONTEND_DIST
        value: /app/frontend/dist
      - key: RESULTS_DIR
        value: /app/outputs/results
      - key: DEFAULT_CONFIDENCE
        value: "0.35"
      - key: DEFAULT_IOU
        value: "0.45"
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: ALLOWED_ORIGINS
        value: "*"
